name: wire-arc-analytics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: "!contains(github.event.head_commit.message, 'analytics: wire Arc analytics routes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire routes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/index.ts')
          text = path.read_text()
          imp = 'import { registerArcAnalyticsRoutes } from "./arc-analytics.js";\n'
          if imp not in text:
              anchor = 'import { schemaSql } from "./schema.js";\n'
              text = text.replace(anchor, anchor + imp)
          call = 'registerArcAnalyticsRoutes(app, db);\n\n'
          if call not in text:
              anchor = 'await app.register(cors, {\n  origin: process.env.CORS_ORIGIN?.split(",") ?? true\n});\n\n'
              text = text.replace(anchor, anchor + call)
          path.write_text(text)
          PY
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/index.ts
          git commit -m "analytics: wire Arc analytics routes"
          git push origin HEAD:main

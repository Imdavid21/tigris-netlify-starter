name: Deploy Celestial Arc Mainnet

on:
  workflow_dispatch:
    inputs:
      rpc_url:
        description: Arc Mainnet RPC URL
        required: true
        type: string
      protocol_treasury:
        description: Protocol treasury address
        required: true
        default: "0x8c377ed06931c379e7C1f31a1753Fe5e03ffBe01"
        type: string
      confirm:
        description: Type DEPLOY ARC MAINNET
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ARC_RPC_URL: ${{ inputs.rpc_url }}
      PROTOCOL_TREASURY: ${{ inputs.protocol_treasury }}
      EXPECTED_DEPLOYER: "0x8c377ed06931c379e7C1f31a1753Fe5e03ffBe01"
      RAW_PRIVATE_KEY: ${{ secrets.ARC_DEPLOYER_PRIVATE_KEY }}
      ARC_USDC: "0x3600000000000000000000000000000000000000"

    steps:
      - name: Require explicit confirmation
        run: test "${{ inputs.confirm }}" = "DEPLOY ARC MAINNET"

      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: Normalize and verify deployer
        run: |
          test -n "$RAW_PRIVATE_KEY"
          case "$RAW_PRIVATE_KEY" in
            0x*) PRIVATE_KEY="$RAW_PRIVATE_KEY" ;;
            *) PRIVATE_KEY="0x$RAW_PRIVATE_KEY" ;;
          esac
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> "$GITHUB_ENV"
          DEPLOYER=$(cast wallet address --private-key "$PRIVATE_KEY")
          test "${DEPLOYER,,}" = "${EXPECTED_DEPLOYER,,}"

      - name: Verify Arc Mainnet and USDC
        run: |
          test "$(cast chain-id --rpc-url "$ARC_RPC_URL")" = "5042"
          CODE=$(cast code "$ARC_USDC" --rpc-url "$ARC_RPC_URL")
          test "$CODE" != "0x"
          test "$(cast call "$ARC_USDC" 'decimals()(uint8)' --rpc-url "$ARC_RPC_URL")" = "6"
          BALANCE=$(cast balance "$EXPECTED_DEPLOYER" --rpc-url "$ARC_RPC_URL")
          test "$BALANCE" != "0"

      - name: Test contracts
        run: forge test -vv

      - name: Deploy Celestial base protocol
        id: deploy
        run: |
          set -o pipefail
          forge script packages/contracts/script/DeployCelestialMainnet.s.sol:DeployCelestialMainnet \
            --rpc-url "$ARC_RPC_URL" \
            --broadcast \
            -vvv | tee /tmp/celestial-mainnet-deployment.log

          FACTORY=$(grep "CELESTIAL_FACTORY" /tmp/celestial-mainnet-deployment.log | tail -1 | awk '{print $NF}')
          ESCROW=$(grep "CELESTIAL_FEE_ESCROW" /tmp/celestial-mainnet-deployment.log | tail -1 | awk '{print $NF}')
          BUYBACK=$(grep "CELESTIAL_BUYBACK_VAULT" /tmp/celestial-mainnet-deployment.log | tail -1 | awk '{print $NF}')
          LOCKER=$(grep "CELESTIAL_LIQUIDITY_LOCKER" /tmp/celestial-mainnet-deployment.log | tail -1 | awk '{print $NF}')
          ORDERBOOK=$(grep "CELESTIAL_LIMIT_ORDER_BOOK" /tmp/celestial-mainnet-deployment.log | tail -1 | awk '{print $NF}')

          {
            echo "## Celestial Arc Mainnet"
            echo "- Chain ID: 5042"
            echo "- Factory: `$FACTORY`"
            echo "- Fee escrow: `$ESCROW`"
            echo "- Buyback vault: `$BUYBACK`"
            echo "- Liquidity locker: `$LOCKER`"
            echo "- Limit order book: `$ORDERBOOK`"
            echo "- USDC: `$ARC_USDC`"
            echo ""
            echo "Graduation adapter is intentionally not configured by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: celestial-mainnet-deployment
          path: |
            /tmp/celestial-mainnet-deployment.log
            broadcast/

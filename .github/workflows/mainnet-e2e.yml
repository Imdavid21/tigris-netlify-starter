name: Capped Supershot Mainnet E2E

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN CAPPED E2E
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supershot-mainnet-e2e
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARC_RPC_URL: https://rpc.mainnet.arc.io
      RAW_PRIVATE_KEY: ${{ secrets.ARC_DEPLOYER_PRIVATE_KEY }}
      EXPECTED_WALLET: "0x8c377ed06931c379e7C1f31a1753Fe5e03ffBe01"
      FACTORY: "0x8F146d29EAf59fC1E93924F8D1BBd1Eae8C29423"
      ORDER_BOOK: "0xED7b5904e272d3DF891179D916D2E3A939ed1471"
      USDC: "0x3600000000000000000000000000000000000000"

    steps:
      - uses: actions/checkout@v4

      - name: Install verified Arc Foundry release
        run: |
          set -euo pipefail
          ARC_FOUNDRY_VERSION="v0.8.0-1"
          ASSET="arc-foundry-${ARC_FOUNDRY_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          BASE="https://github.com/circlefin/arc-foundry/releases/download/${ARC_FOUNDRY_VERSION}"
          curl --fail --location --retry 3 -o "/tmp/$ASSET" "$BASE/$ASSET"
          curl --fail --location --retry 3 -o "/tmp/$ASSET.sha256" "$BASE/$ASSET.sha256"
          (cd /tmp && sha256sum -c "$ASSET.sha256")
          mkdir -p /tmp/arc-foundry
          tar -xzf "/tmp/$ASSET" -C /tmp/arc-foundry
          sudo install -m 0755 /tmp/arc-foundry/forge /usr/local/bin/arc-forge
          sudo install -m 0755 /tmp/arc-foundry/cast /usr/local/bin/arc-cast

      - name: Require explicit manual confirmation when dispatched
        if: github.event_name == 'workflow_dispatch'
        run: test "${{ inputs.confirm }}" = "RUN CAPPED E2E"

      - name: Install dependencies
        run: |
          arc-forge install OpenZeppelin/openzeppelin-contracts
          arc-forge install foundry-rs/forge-std

      - name: Validate wallet, network, contracts, and budget
        run: |
          set -euo pipefail
          test -n "$RAW_PRIVATE_KEY"
          case "$RAW_PRIVATE_KEY" in
            0x*) PRIVATE_KEY="$RAW_PRIVATE_KEY" ;;
            *) PRIVATE_KEY="0x$RAW_PRIVATE_KEY" ;;
          esac
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> "$GITHUB_ENV"

          WALLET=$(arc-cast wallet address --private-key "$PRIVATE_KEY")
          test "${WALLET,,}" = "${EXPECTED_WALLET,,}"
          test "$(arc-cast chain-id --rpc-url "$ARC_RPC_URL")" = "5042"

          for TARGET in "$FACTORY" "$ORDER_BOOK" "$USDC"; do
            test "$(arc-cast code "$TARGET" --rpc-url "$ARC_RPC_URL")" != "0x"
          done

          BALANCE=$(arc-cast balance "$WALLET" --rpc-url "$ARC_RPC_URL")
          test "$BALANCE" -ge 5000000000000000000
          echo "START_BALANCE=$BALANCE" >> "$GITHUB_ENV"
          echo "Wallet balance before run: $BALANCE native micro-USDC units" >> "$GITHUB_STEP_SUMMARY"

      - name: Build before broadcasting
        run: arc-forge build

      - name: Simulate capped lifecycle
        run: |
          arc-forge script packages/contracts/script/RunMainnetE2E.s.sol:RunMainnetE2E \
            --rpc-url "$ARC_RPC_URL" -vvvv

      - name: Broadcast capped lifecycle
        run: |
          set -o pipefail
          arc-forge script packages/contracts/script/RunMainnetE2E.s.sol:RunMainnetE2E \
            --rpc-url "$ARC_RPC_URL" --broadcast --slow -vvvv 2>&1 | tee /tmp/supershot-mainnet-e2e.log

      - name: Enforce final wallet-loss cap
        if: always()
        run: |
          set -euo pipefail
          END_BALANCE=$(arc-cast balance "$EXPECTED_WALLET" --rpc-url "$ARC_RPC_URL")
          if [ -n "${START_BALANCE:-}" ]; then
            LOSS=$(node -e 'const a=BigInt(process.argv[1]),b=BigInt(process.argv[2]); console.log((a>b?a-b:0n).toString())' "$START_BALANCE" "$END_BALANCE")
            {
              echo "Wallet balance after run: $END_BALANCE native units"
              echo "Net wallet loss: $LOSS native units"
              echo "Configured cap: 5 USDC-equivalent"
            } >> "$GITHUB_STEP_SUMMARY"
            node -e 'if (BigInt(process.argv[1]) > 5000000000000000000n) process.exit(1)' "$LOSS"
          fi

      - name: Upload E2E logs and broadcasts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supershot-mainnet-e2e
          path: |
            /tmp/supershot-mainnet-e2e.log
            broadcast/

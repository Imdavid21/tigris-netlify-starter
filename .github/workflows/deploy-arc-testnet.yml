name: Deploy Arc Testnet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      ARC_RPC_URL: "https://rpc.testnet.arc.network"
      ARC_USDC_ADDRESS: "0x3600000000000000000000000000000000000000"
      PROTOCOL_TREASURY: "0x8c377ed06931c379e7C1f31a1753Fe5e03ffBe01"
      EXPECTED_DEPLOYER: "0x8c377ed06931c379e7C1f31a1753Fe5e03ffBe01"
      RAW_PRIVATE_KEY: ${{ secrets.ARC_DEPLOYER_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: Normalize and verify deployer secret
        run: |
          test -n "$RAW_PRIVATE_KEY"
          case "$RAW_PRIVATE_KEY" in
            0x*) PRIVATE_KEY="$RAW_PRIVATE_KEY" ;;
            *) PRIVATE_KEY="0x$RAW_PRIVATE_KEY" ;;
          esac
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> "$GITHUB_ENV"

          DEPLOYER=$(cast wallet address --private-key "$PRIVATE_KEY")
          echo "Deployer: $DEPLOYER"
          test "${DEPLOYER,,}" = "${EXPECTED_DEPLOYER,,}"

      - name: Verify Arc Testnet configuration
        run: |
          test "$(cast chain-id --rpc-url "$ARC_RPC_URL")" = "5042002"
          test "$(cast call "$ARC_USDC_ADDRESS" "decimals()(uint8)" --rpc-url "$ARC_RPC_URL")" = "6"
          BALANCE=$(cast balance "$EXPECTED_DEPLOYER" --rpc-url "$ARC_RPC_URL")
          echo "Native gas balance: $BALANCE"
          test "$BALANCE" != "0"

      - name: Test contracts
        run: forge test -vv

      - name: Simulate deployment
        run: |
          forge script packages/contracts/script/Deploy.s.sol:Deploy \
            --rpc-url "$ARC_RPC_URL" \
            -vvv

      - name: Deploy to Arc Testnet
        id: deploy
        run: |
          set -o pipefail
          forge script packages/contracts/script/Deploy.s.sol:Deploy \
            --rpc-url "$ARC_RPC_URL" \
            --broadcast \
            -vvv | tee /tmp/arc-deployment.log

          FACTORY=$(grep "ARC_LAUNCH_FACTORY" /tmp/arc-deployment.log | tail -1 | awk '{print $NF}')
          ESCROW=$(grep "ARC_FEE_ESCROW" /tmp/arc-deployment.log | tail -1 | awk '{print $NF}')
          LOCKER=$(grep "ARC_LIQUIDITY_LOCKER" /tmp/arc-deployment.log | tail -1 | awk '{print $NF}')

          test -n "$FACTORY"
          test -n "$ESCROW"
          test -n "$LOCKER"

          echo "factory=$FACTORY" >> "$GITHUB_OUTPUT"

          {
            echo "## Arc Testnet deployment"
            echo ""
            echo "- Factory: `$FACTORY`"
            echo "- Fee escrow: `$ESCROW`"
            echo "- Liquidity locker: `$LOCKER`"
            echo "- Treasury: `$PROTOCOL_TREASURY`"
            echo "- USDC: `$ARC_USDC_ADDRESS`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed factory
        run: |
          CODE=$(cast code "${{ steps.deploy.outputs.factory }}" --rpc-url "$ARC_RPC_URL")
          test "$CODE" != "0x"

      - uses: actions/upload-artifact@v4
        with:
          name: arc-testnet-deployment
          path: |
            /tmp/arc-deployment.log
            broadcast/
          if-no-files-found: warn

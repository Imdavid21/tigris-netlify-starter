name: One-shot Mainnet Cutover Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/mainnet-cutover.trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cutover cleanup
        run: python3 .github/scripts/mainnet_cutover.py
      - name: Verify web builds
        run: |
          npm install
          npm --workspace @arc-launchpad/web run build
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web .env.example docs/MAINNET_DEPLOYMENT.md AGENTS.md
          if git diff --cached --quiet; then
            echo "No cutover changes needed"
            exit 0
          fi
          git commit -m "mainnet: isolate testnet and clean production frontend"
          git push origin HEAD:main

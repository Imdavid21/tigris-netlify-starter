name: Celestial Signed Stress Test

on:
  push:
    branches:
      - wallet-e2e-stress
    paths:
      - "packages/contracts/**"
      - "scripts/stress-celestial-rpc.mjs"
      - ".github/workflows/stress-celestial-testnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARC_RPC_URL: "https://rpc.testnet.arc.network"
      EXPECTED_SIGNER: "0x8c377ed06931c379e7C1f31a1753Fe5e03ffBe01"
      RAW_PRIVATE_KEY: ${{ secrets.ARC_DEPLOYER_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Solidity dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: Verify test signer and Arc testnet
        run: |
          set -euo pipefail
          test -n "$RAW_PRIVATE_KEY"
          case "$RAW_PRIVATE_KEY" in
            0x*) PRIVATE_KEY="$RAW_PRIVATE_KEY" ;;
            *) PRIVATE_KEY="0x$RAW_PRIVATE_KEY" ;;
          esac
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> "$GITHUB_ENV"

          SIGNER=$(cast wallet address --private-key "$PRIVATE_KEY")
          test "${SIGNER,,}" = "${EXPECTED_SIGNER,,}"
          test "$(cast chain-id --rpc-url "$ARC_RPC_URL")" = "5042002"

          NATIVE_BALANCE=$(cast balance "$SIGNER" --rpc-url "$ARC_RPC_URL")
          USDC_BALANCE=$(cast call 0x3600000000000000000000000000000000000000 \
            "balanceOf(address)(uint256)" "$SIGNER" --rpc-url "$ARC_RPC_URL")

          echo "Signer: $SIGNER"
          echo "Native balance: $NATIVE_BALANCE"
          echo "USDC balance: $USDC_BALANCE"
          echo "### Preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "- Network: Arc testnet (5042002)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signer: \`$SIGNER\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native balance: \`$NATIVE_BALANCE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- USDC balance: \`$USDC_BALANCE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Compile and run contract tests
        run: |
          set -o pipefail
          forge build
          forge test -vv | tee /tmp/forge-tests.log

      - name: Install RPC stress runner dependency
        run: npm install --no-save --ignore-scripts --no-audit --no-fund viem@2.21.54

      - name: Run 26 randomized signed launch/trade simulations through Arc RPC
        run: |
          set -o pipefail
          node scripts/stress-celestial-rpc.mjs | tee /tmp/celestial-stress.log
          grep -Fq "STRESS_OK|1" /tmp/celestial-stress.log

          {
            echo ""
            echo "### Signed stress result"
            echo '```text'
            grep -E "STRESS_(FACTORY|LAUNCHES|MARKET_ACTIONS|BUYS|SELLS|ATOMIC_LAUNCHES|CLAIMS|BUYBACKS|TRANSACTIONS|START_NATIVE|START_USDC|END_NATIVE|END_USDC|OK)" /tmp/celestial-stress.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celestial-signed-stress-test
          path: |
            /tmp/forge-tests.log
            /tmp/celestial-stress.log
            /tmp/celestial-stress-summary.json
            /tmp/celestial-stress-transactions.json

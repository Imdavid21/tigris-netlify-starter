name: Apply token image upload support

on:
  push:
    branches:
      - feature/token-image-upload

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/token-image-upload
      - name: Patch image upload flow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected fragment not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          form = "apps/web/components/create-token-form.tsx"
          replace_once(form, 'import { motionSpring } from "@/lib/motion-system";\n', 'import { motionSpring } from "@/lib/motion-system";\nimport { API_URL } from "@/lib/api";\n')
          replace_once(form, 'function getProvider(): EIP1193Provider | undefined {\n  return (window as Window & { ethereum?: EIP1193Provider }).ethereum;\n}\n', '''const IMAGE_TYPES = new Set(["image/png", "image/jpeg", "image/webp", "image/gif"]);\nconst MAX_IMAGE_BYTES = 5 * 1024 * 1024;\n\nfunction getProvider(): EIP1193Provider | undefined {\n  return (window as Window & { ethereum?: EIP1193Provider }).ethereum;\n}\n\nfunction readFileAsDataUrl(file: File) {\n  return new Promise<string>((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = () => resolve(String(reader.result ?? ""));\n    reader.onerror = () => reject(new Error("Could not read the selected image."));\n    reader.readAsDataURL(file);\n  });\n}\n\nasync function uploadTokenImage(file: File) {\n  if (!IMAGE_TYPES.has(file.type)) throw new Error("Use a PNG, JPG, WebP, or GIF image.");\n  if (file.size > MAX_IMAGE_BYTES) throw new Error("Token images must be 5 MB or smaller.");\n\n  const dataUrl = await readFileAsDataUrl(file);\n  const response = await fetch(API_URL + "/uploads/images", {\n    method: "POST",\n    headers: { "content-type": "application/json" },\n    body: JSON.stringify({ dataUrl })\n  });\n  const payload = await response.json() as { path?: string; error?: string };\n  if (!response.ok || !payload.path) throw new Error(payload.error ?? "Image upload failed.");\n  return API_URL.replace(/\\/$/, "") + payload.path;\n}\n''')
          replace_once(form, '  const [status, setStatus] = useState<"idle" | "wallet" | "submitted" | "confirmed">("idle");', '  const [status, setStatus] = useState<"idle" | "uploading" | "wallet" | "submitted" | "confirmed">("idle");')
          replace_once(form, '  const [image, setImage] = useState("");\n', '  const [image, setImage] = useState("");\n  const [imageFile, setImageFile] = useState<File>();\n  const [imagePreview, setImagePreview] = useState("");\n')
          replace_once(form, '    Boolean(description.trim() || image.trim() || website.trim() || twitter.trim() || telegram.trim()) ||', '    Boolean(description.trim() || image.trim() || imageFile || website.trim() || twitter.trim() || telegram.trim()) ||')
          replace_once(form, '    try {\n      setStatus("wallet");\n      await ensureArcChain(ethereum);', '''    try {\n      let imageUrl = image.trim();\n      if (imageFile) {\n        setStatus("uploading");\n        imageUrl = await uploadTokenImage(imageFile);\n        setImage(imageUrl);\n      }\n\n      setStatus("wallet");\n      await ensureArcChain(ethereum);''')
          replace_once(form, '            image: image.trim(),', '            image: imageUrl,')
          replace_once(form, '              <label><span>Image URL</span><input value={image} onChange={(e) => setImage(e.target.value)} placeholder="https:// or ipfs://" /></label>', '''              <label className="image-upload-field">\n                <span>Token image</span>\n                <input\n                  className="image-upload-input"\n                  type="file"\n                  accept="image/png,image/jpeg,image/webp,image/gif"\n                  onChange={(event) => {\n                    const file = event.target.files?.[0];\n                    if (!file) return;\n                    if (!IMAGE_TYPES.has(file.type)) {\n                      setError("Use a PNG, JPG, WebP, or GIF image.");\n                      event.target.value = "";\n                      return;\n                    }\n                    if (file.size > MAX_IMAGE_BYTES) {\n                      setError("Token images must be 5 MB or smaller.");\n                      event.target.value = "";\n                      return;\n                    }\n                    setError(undefined);\n                    setImage("");\n                    setImageFile(file);\n                    const reader = new FileReader();\n                    reader.onload = () => setImagePreview(String(reader.result ?? ""));\n                    reader.readAsDataURL(file);\n                  }}\n                />\n                <small>{imageFile ? imageFile.name : "PNG, JPG, WebP, or GIF · max 5 MB"}</small>\n              </label>''')
          replace_once(form, '              disabled={status === "wallet" || status === "submitted"}', '              disabled={status === "uploading" || status === "wallet" || status === "submitted"}')
          replace_once(form, '{status === "wallet" ? "Confirm in wallet" : status === "submitted" ? "Confirming launch" : status === "confirmed" ? "Launched" : "Launch token"}', '{status === "uploading" ? "Uploading image" : status === "wallet" ? "Confirm in wallet" : status === "submitted" ? "Confirming launch" : status === "confirmed" ? "Launched" : "Launch token"}')
          replace_once(form, '          >{previewSymbol.slice(0, 2)}</motion.div>', '          >\n            {imagePreview || image ? <img src={imagePreview || image} alt="" /> : previewSymbol.slice(0, 2)}\n          </motion.div>')

          api_index = "apps/api/src/index.ts"
          replace_once(api_index, 'import Fastify from "fastify";\n', 'import Fastify from "fastify";\nimport { randomUUID } from "node:crypto";\n')
          replace_once(api_index, 'const app = Fastify({ logger: true });', 'const app = Fastify({ logger: true, bodyLimit: 8 * 1024 * 1024 });')
          replace_once(api_index, '''app.get("/health", async () => {\n  const result = await db.query("select now() as now");\n  return { ok: true, databaseTime: result.rows[0].now, databaseSchema };\n});\n''', '''app.get("/health", async () => {\n  const result = await db.query("select now() as now");\n  return { ok: true, databaseTime: result.rows[0].now, databaseSchema };\n});\n\nconst allowedImageTypes = new Set(["image/png", "image/jpeg", "image/webp", "image/gif"]);\nconst maxImageBytes = 5 * 1024 * 1024;\nconst uploadWindows = new Map<string, { count: number; resetAt: number }>();\n\napp.post("/uploads/images", async (request, reply) => {\n  const now = Date.now();\n  const key = request.ip;\n  const window = uploadWindows.get(key);\n  if (!window || window.resetAt <= now) {\n    uploadWindows.set(key, { count: 1, resetAt: now + 60 * 60 * 1000 });\n  } else {\n    if (window.count >= 20) return reply.code(429).send({ error: "Too many image uploads. Try again later." });\n    window.count += 1;\n  }\n\n  const body = request.body as { dataUrl?: string } | undefined;\n  const match = /^data:(image\\/(?:png|jpeg|webp|gif));base64,([A-Za-z0-9+/=]+)$/.exec(body?.dataUrl ?? "");\n  if (!match || !allowedImageTypes.has(match[1])) return reply.code(400).send({ error: "Use a PNG, JPG, WebP, or GIF image." });\n\n  const data = Buffer.from(match[2], "base64");\n  if (!data.length || data.length > maxImageBytes) return reply.code(400).send({ error: "Token images must be 5 MB or smaller." });\n\n  const id = randomUUID();\n  await db.query("insert into token_images(id,mime_type,data,size_bytes) values ($1,$2,$3,$4)", [id, match[1], data, data.length]);\n  return reply.code(201).send({ id, path: `/uploads/images/${id}` });\n});\n\napp.get("/uploads/images/:id", async (request, reply) => {\n  const { id } = request.params as { id: string };\n  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)) return reply.code(400).send({ error: "invalid image id" });\n  const result = await db.query("select mime_type,data from token_images where id=$1 limit 1", [id]);\n  if (!result.rowCount) return reply.code(404).send({ error: "not found" });\n  reply.header("Cache-Control", "public, max-age=31536000, immutable");\n  reply.header("X-Content-Type-Options", "nosniff");\n  return reply.type(result.rows[0].mime_type).send(result.rows[0].data);\n});\n''')

          schema = Path("apps/api/src/schema.ts")
          text = schema.read_text()
          marker = 'create table if not exists token_images ('
          if marker not in text:
              text = text.replace('\n`;\n', '''\ncreate table if not exists token_images (\n  id uuid primary key,\n  mime_type text not null,\n  data bytea not null,\n  size_bytes integer not null,\n  created_at timestamptz not null default now()\n);\n\n`;\n''')
              schema.write_text(text)

          indexer_schema = Path("apps/indexer/schema.sql")
          text = indexer_schema.read_text()
          if marker not in text:
              text += '''\ncreate table if not exists token_images (\n  id uuid primary key,\n  mime_type text not null,\n  data bytea not null,\n  size_bytes integer not null,\n  created_at timestamptz not null default now()\n);\n'''
              indexer_schema.write_text(text)

          css = Path("apps/web/app/create/CreatePage.module.css")
          text = css.read_text()
          css_marker = '.page :global(.image-upload-input::file-selector-button)'
          if css_marker not in text:
              text += '''\n\n.page :global(.image-upload-field small) {\n  color: var(--md-sys-color-on-surface-variant);\n  font-size: var(--md-sys-typescale-label-small-size);\n  line-height: var(--md-sys-typescale-label-small-line-height);\n}\n\n.page :global(.image-upload-input) {\n  padding: 9px 10px !important;\n  cursor: pointer;\n}\n\n.page :global(.image-upload-input::file-selector-button) {\n  min-height: 36px;\n  margin-right: 12px;\n  padding: 0 14px;\n  border: 0;\n  border-radius: var(--md-sys-shape-corner-full);\n  background: var(--md-sys-color-secondary-container);\n  color: var(--md-sys-color-on-secondary-container);\n  cursor: pointer;\n  font: inherit;\n  font-weight: 650;\n}\n\n.page :global(.launch-preview .token-avatar img) {\n  width: 100%;\n  height: 100%;\n  display: block;\n  object-fit: cover;\n}\n\n.page :global(.launch-preview .token-avatar:has(img)) {\n  overflow: hidden;\n}\n'''
              css.write_text(text)
          PY
      - name: Build apps
        run: |
          npm install
          npm run build
      - name: Commit patch
        run: |
          rm .github/workflows/apply-image-upload.yml
          git config user.name "Uddalak"
          git config user.email "84083101+Imdavid21@users.noreply.github.com"
          git add apps/web/components/create-token-form.tsx apps/web/app/create/CreatePage.module.css apps/api/src/index.ts apps/api/src/schema.ts apps/indexer/schema.sql .github/workflows/apply-image-upload.yml
          git commit -m "feat: add token image upload flow"
          git push origin feature/token-image-upload

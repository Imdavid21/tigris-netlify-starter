name: apps

on:
  push:
    paths:
      - "apps/**"
      - "package.json"
      - ".github/workflows/apps.yml"
  pull_request:
    paths:
      - "apps/**"
      - "package.json"

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: arc_launchpad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arc_launchpad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build all apps
        run: npm run build

      - name: Apply database schema
        env:
          PGPASSWORD: test
        run: psql -h 127.0.0.1 -U postgres -d arc_launchpad -f apps/indexer/schema.sql

      - name: Smoke test API
        env:
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/arc_launchpad
          PORT: "3001"
          CORS_ORIGIN: http://localhost:3000
        run: |
          npm --workspace @arc-launchpad/api run start > /tmp/arc-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3001/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/health | grep '"ok":true'
          curl -fsS http://127.0.0.1:3001/tokens | grep '"items"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/tokens/not-an-address)" = "400"

      - name: Smoke test web routes
        env:
          NEXT_PUBLIC_ARC_CHAIN_ID: "5042002"
          NEXT_PUBLIC_ARC_RPC_URL: https://rpc.testnet.arc.network
          NEXT_PUBLIC_USDC_ADDRESS: 0x3600000000000000000000000000000000000000
        run: |
          npm --workspace @arc-launchpad/web run start -- -p 3000 > /tmp/arc-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/ && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ | grep 'Arc Launchpad'
          curl -fsS http://127.0.0.1:3000/create | grep 'Create token'
          curl -fsS http://127.0.0.1:3000/token/0x0000000000000000000000000000000000000001 | grep 'Back'

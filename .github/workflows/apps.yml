name: apps

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev || true
      - run: npm run build
      - run: docker build -f apps/api/Dockerfile -t arc-launchpad-api .
      - run: docker build -f apps/indexer/Dockerfile -t arc-launchpad-indexer .
      - run: |
          docker run -d --name arc-postgres -e POSTGRES_PASSWORD=test -e POSTGRES_DB=arc_launchpad -p 5432:5432 postgres:16
          READY=0
          for i in {1..45}; do
            if docker exec arc-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              READY=$((READY+1))
              if [ "$READY" -ge 3 ]; then break; fi
            else
              READY=0
            fi
            sleep 1
          done
          test "$READY" -ge 3
          docker exec arc-postgres psql -U postgres -d postgres -c "select 1" >/dev/null
          docker exec arc-postgres psql -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='arc_launchpad'" | grep -q 1 || docker exec arc-postgres createdb -U postgres arc_launchpad
          docker exec -i arc-postgres psql -U postgres -d arc_launchpad < apps/indexer/schema.sql
          docker exec -i arc-postgres psql -U postgres -d arc_launchpad <<'SQL'
          insert into tokens(address, curve_address, creator, name, symbol, created_block, created_at, status)
          values (
            decode('1111111111111111111111111111111111111111','hex'),
            decode('2222222222222222222222222222222222222222','hex'),
            decode('3333333333333333333333333333333333333333','hex'),
            'Smoke Token',
            'SMOKE',
            1,
            now(),
            'ACTIVE'
          );
          insert into trades(tx_hash, log_index, block_number, block_time, token, trader, side, token_amount, quote_amount, fee_amount)
          values (
            decode(repeat('44',32),'hex'),
            0,
            2,
            now(),
            decode('1111111111111111111111111111111111111111','hex'),
            decode('5555555555555555555555555555555555555555','hex'),
            'BUY',
            1000000000000000000,
            1000000,
            10000
          );
          SQL
      - run: |
          DATABASE_URL=postgres://postgres:test@127.0.0.1:5432/arc_launchpad PORT=3001 npm --workspace @arc-launchpad/api run start > /tmp/api.log 2>&1 &
          PID=$!
          for i in {1..30}; do curl -fsS http://127.0.0.1:3001/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:3001/health | grep '"ok":true'
          curl -fsS http://127.0.0.1:3001/tokens | grep 'Smoke Token'
          curl -fsS http://127.0.0.1:3001/tokens/0x1111111111111111111111111111111111111111 | grep 'SMOKE'
          curl -fsS http://127.0.0.1:3001/tokens/0x1111111111111111111111111111111111111111 | grep '"BUY"'
          curl -fsS http://127.0.0.1:3001/wallet/0x5555555555555555555555555555555555555555/activity | grep '"BUY"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/tokens/not-an-address)" = "400"
          kill $PID
      - run: |
          CHAIN=$(curl -fsS https://rpc.testnet.arc.network -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}')
          echo "$CHAIN" | grep -i '0x4cef52'
          DECIMALS=$(curl -fsS https://rpc.testnet.arc.network -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_call","params":[{"to":"0x3600000000000000000000000000000000000000","data":"0x313ce567"},"latest"]}')
          echo "$DECIMALS" | grep -E '0x0*6"'
      - run: |
          NEXT_PUBLIC_ARC_CHAIN_ID=5042002 NEXT_PUBLIC_ARC_RPC_URL=https://rpc.testnet.arc.network NEXT_PUBLIC_USDC_ADDRESS=0x3600000000000000000000000000000000000000 npm --workspace @arc-launchpad/web run start -- -p 3000 > /tmp/web.log 2>&1 &
          PID=$!
          for i in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/explore; then break; fi
            sleep 1
          done
          ROOT_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          case "$ROOT_STATUS" in
            200|307|308) ;;
            *) echo "Unexpected root status: $ROOT_STATUS"; exit 1 ;;
          esac
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/explore)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/create)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/token/0x0000000000000000000000000000000000000001)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/profile)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/analytics)" = "200"
          kill $PID
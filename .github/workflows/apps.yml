name: apps

on:
  push:
    paths:
      - "apps/**"
      - "package.json"
      - ".github/workflows/apps.yml"
  pull_request:
    paths:
      - "apps/**"
      - "package.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Build
        run: npm run build

name: Arc Mainnet Web Build

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .env.example
      - .github/workflows/mainnet-web-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ARC_CHAIN_ID: "5042"
      NEXT_PUBLIC_ARC_RPC_URL: "https://rpc.mainnet.arc.io"
      NEXT_PUBLIC_ARC_EXPLORER_URL: "https://arc-scan.org"
      NEXT_PUBLIC_USDC_ADDRESS: "0x3600000000000000000000000000000000000000"
      NEXT_PUBLIC_CELESTIAL_FACTORY_ADDRESS: "0x1111111111111111111111111111111111111111"
      NEXT_PUBLIC_CELESTIAL_FEE_ESCROW_ADDRESS: "0x2222222222222222222222222222222222222222"
      NEXT_PUBLIC_CELESTIAL_BUYBACK_VAULT_ADDRESS: "0x3333333333333333333333333333333333333333"
      NEXT_PUBLIC_CELESTIAL_LIQUIDITY_LOCKER_ADDRESS: "0x4444444444444444444444444444444444444444"
      NEXT_PUBLIC_CELESTIAL_ORDERBOOK_ADDRESS: "0x5555555555555555555555555555555555555555"
      NEXT_PUBLIC_CELESTIAL_DEX_ADAPTER_ADDRESS: "0x6666666666666666666666666666666666666666"
      NEXT_PUBLIC_API_URL: "https://arc-launchpad-api.onrender.com"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build Celestial-only Arc Mainnet frontend
        run: npm --workspace @arc-launchpad/web run build

name: wire-arc-analytics-sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: "!contains(github.event.head_commit.message, 'analytics: start Arc 30 minute indexer')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire Arc analytics indexer
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/index.ts')
          text = path.read_text()
          text = text.replace(
              'import { registerArcAnalyticsRoutes } from "./arc-analytics.js";',
              'import { registerArcAnalyticsRoutes, startArcAnalyticsIndexer } from "./arc-analytics.js";'
          )
          anchor = 'registerArcAnalyticsRoutes(app, db);\n'
          if 'startArcAnalyticsIndexer(app, db);' not in text:
              text = text.replace(anchor, anchor + 'startArcAnalyticsIndexer(app, db);\n')
          path.write_text(text)
          PY
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/index.ts
          git commit -m "analytics: start Arc 30 minute indexer"
          git push origin HEAD:main
